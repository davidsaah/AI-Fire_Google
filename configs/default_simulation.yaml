# Default wildfire spread simulation configuration
simulation:
  cell_resolution_m: 30.0
  duration_minutes: 180.0
  time_step_seconds: 60.0

weather:
  source: "weathernext"
  default_wind_speed_mph: 15.0
  default_wind_direction_deg: 240.0
  default_temperature_f: 85.0
  default_relative_humidity_pct: 15.0

fuels:
  default_model: "GS2"
  dead_fuel_moisture: [0.05, 0.06, 0.08] # 1-hr, 10-hr, 100-hr
  live_fuel_moisture: [0.60, 0.90]       # Live herb, live woody
